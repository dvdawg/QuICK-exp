schema_version: 3

site:
  lab: example-lab
  timezone: UTC
  operator: null

device:
  name: example-device
  chip: example-chip
  package: example-package
  cooldown: null
  qubits: [q0]
  resonators: [r0]

storage:
  quick_native_output: true
  quick_native_root: ./data

qick:
  host: qick-controller.example.invalid
  pyro_port: 8888
  proxy_name: qick
  board_model: null
  board_serial: null
  qick_version: 0.7.2
  firmware: null
  bitfile: null
  bitfile_sha256: null
  reference_clock_mhz: null
  reset_generators_on_connect: true
  clear_interrupts_on_connect: true
  reset_policy: notebook_compatible
  show_progress: true
  progress_mode: terminal

# Logical indices are Quick/QICK indices, not physical connector numbers.
channels:
  r:
    gen: 0
    physical_port: DAC0
    generator_type: axis_signal_gen_v6
    nyquist_zone: 1
  rr:
    ro: 0
    physical_port: ADC0
    readout_type: axis_dyn_readout_v1
    matched_generator: r
  q:
    gen: 1
    physical_port: DAC1
    generator_type: axis_signal_gen_v6
    nyquist_zone: 1
  z:
    gen: 2
    physical_port: DAC2
    generator_type: axis_sg_int4_v2
    coupling: dc

# RF-board programming is disabled in this public example and must be reviewed
# before live use.
rf_board:
  apply_on_connect: false
  generators:
    r:
      enabled: false
      channel: 0
      attenuator_1_db: 0.0
      attenuator_2_db: 0.0
      filter: {type: bypass, center_ghz: 0.0, bandwidth_ghz: 1.0}
    q:
      enabled: false
      channel: 1
      attenuator_1_db: 0.0
      attenuator_2_db: 0.0
      filter: {type: bypass, center_ghz: 0.0, bandwidth_ghz: 1.0}
  readouts:
    rr:
      enabled: false
      channel: 0
      attenuation_db: 0.0
      filter: {type: bypass, center_ghz: 0.0, bandwidth_ghz: 1.0}
  biases: {}

external_instruments:
  flux_supply:
    driver: inject-at-runtime
    resource: null
    owns_output: false

flux_lines:
  z_rf:
    backend: rf_dac
    channel: z
    unit: dac_gain
    park: 0.0
    minimum: -0.8
    maximum: 0.8
    hold_pulse_us: 0.2
    program_settle_us: 5.0
    dummy_readout_length_us: 2.0
    dummy_relax_us: 2.0
    settle_seconds: 0.0
    coupling: dc
    refresh_policy: before_each_outer_row
    reset_policy: reapply_after_generator_reset
    command_verification: command_only
  z_dc:
    backend: external_dc
    instrument: flux_supply
    unit: V
    park: 0.0
    minimum: -1.0
    maximum: 1.0
    max_step: 0.02
    step_delay: 0.1
    settle_seconds: 0.2
    readback_tolerance: 0.0001
    owns_output: false

# Synthetic public defaults; replace before live use.
defaults:
  r_freq: 6884.0
  r_power: -35.0
  r_length: 2.0
  r_offset: 0.5
  r_phase: 0.0
  r_relax: 20.0
  r_reset: 0
  r_threshold: 0.0
  q_freq: 5600.0
  q_gain: 0.4
  q_length: 0.1
  q_delta: -180.0
  q_gain_2: 0.2
  q_length_2: 0.1
  z_gain: 0.0
  z_length: 0.2
  z_settle: 5.0
  hard_avg: 1000
  soft_avg: 1
  rep: 1

limits:
  r_freq: [5000.0, 9000.0]
  q_freq: [2000.0, 8000.0]
  r_power: [-60.0, 0.0]
  q_gain: [-1.0, 1.0]
  q_gain_2: [-1.0, 1.0]
  z_gain: [-0.8, 0.8]
  z_length: [0.001, 1000.0]
  z_settle: [0.0, 100000.0]
  r_length: [0.01, 1000.0]
  q_length: [0.001, 1000.0]
  q_length_2: [0.001, 1000.0]
  hard_avg: [1, 100000]
  soft_avg: [1, 100]
  rep: [0, 100000]
  maximum_retry_attempts: [1, 5]

safety:
  require_port_check_before_live_run: true
  require_reviewed_flux_controller: true
  park_flux_on_exit: true

autocal:
  # Both migrations are hardware-owned and opt-in. Empty preserves the legacy
  # path until a deliberate supervised rollout enables N5 and/or N2/N3.
  hypothesis_nodes: []
  adaptive_nodes: []
  hard_stop_records:
    - defaults.r_offset
    - lookups.resonator_vs_flux
    - lookups.qubit_vs_flux
  auto_accept:
    defaults.r_freq: {absolute_mhz: 0.5}
    defaults.q_freq: {absolute_mhz: 1.0}
    defaults.q_length: {relative: 0.15}
    defaults.q_gain: {relative: 0.15}
    defaults.r_power: {absolute_db: 3.0}
    defaults.r_threshold: {always: true}
    derived.t1: {always: true}
    derived.t2_ramsey: {always: true}
    derived.t2_echo: {always: true}
  budgets:
    max_wall_clock_hours: 8.0
    max_node_attempts: 3
    max_total_runs: 200
  caps:
    q_gain_max: 0.8
    r_power_max_db: -20.0
  ramsey_sign:
    require_two_point_confirmation: true
  hypothesis:
    margin_threshold: 2.0
    probe_budget_seconds: 600.0
    top_k_candidates: 3
    candidate_prominence_ratio: 0.5
  backtracking:
    max_backtracks_per_session: 3
    max_backtracks_per_address: 2
  adaptive:
    initial_rows: 5
    max_rows: 7
    abort_after_rows: 5
  advisor:
    mode: "null"
    model: claude-sonnet-5
    timeout_seconds: 60.0

expected:
  r_freq_mhz: [6800.0, 6950.0]
  q_freq_mhz: [3500.0, 6000.0]
  adc_fullscale_counts: null
